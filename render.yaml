# Render blueprint -- free tier. `render.yaml` at the repo root; Render reads it on
# Blueprint deploy.
#
# Four resources, all free:
#
#   ledgerloop-db     PostgreSQL. The record of truth.
#   ledgerloop-redis  Key Value (Redis). The transport, not storage.
#   ledgerloop-api    Web service. API + matcher + relay + sweeper, one process.
#   ledgerloop-web    Static site. The React client. Computes nothing.
#
# Render has no free instance type for background workers or cron jobs, so the service
# that would normally host the background loops cannot exist here. The matcher, relay
# and sweeper move into the API process via LEDGERLOOP_EMBED_WORKER.
#
# This is a deployment concession and not a redesign. The loops are the same objects
# driven by the same shutdown protocol; only the process boundary moved. What it costs
# is written down in worker/embedded.py and in DEPLOY.md, and the paid topology is one
# env var plus a service block away -- see "Upgrading" in DEPLOY.md.
#
# Region: the database, Key Value and API must name the SAME region or they cross the
# public internet and lose private networking. Change those three together, or not at
# all. The static site takes no region -- it is CDN-served everywhere.

databases:
  - name: ledgerloop-db
    databaseName: ledgerloop
    user: ledgerloop
    region: singapore
    plan: free
    # Pinned to the version docker-compose and the test containers run. The suite's
    # guarantees are about PostgreSQL-specific behaviour -- partial unique indexes,
    # FOR UPDATE SKIP LOCKED, percentile_cont -- so testing a different major than we
    # deploy would make them hollow.
    postgresMajorVersion: "15"

services:
  # --- Redis ---------------------------------------------------------------
  - type: keyvalue
    name: ledgerloop-redis
    region: singapore
    plan: free
    # Internal only. Nothing outside Render has any business reaching the stream.
    ipAllowList: []
    # noeviction, deliberately, and this is the important line in the file.
    #
    # Under allkeys-lru a full instance silently drops stream entries. The transactions
    # they pointed at are still in Postgres, so the sweeper would eventually classify
    # them as unmatched -- fabricating breaks for payments that reconcile fine, which
    # is this project's worst failure mode.
    #
    # Under noeviction XADD fails loudly instead. The outbox rows stay unpublished, the
    # relay retries them, and ledgerloop_outbox_backlog climbs where you can see it.
    maxmemoryPolicy: noeviction

  # --- API + embedded matcher ----------------------------------------------
  - type: web
    name: ledgerloop-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile

    # Migrations run here because Render's preDeployCommand needs a paid instance type.
    # Safe at ONE instance and only one: Alembic takes no lock that would make N
    # replicas racing `upgrade head` on boot safe. The free plan gives exactly one.
    #
    # `exec` so uvicorn replaces the shell and receives SIGTERM directly -- without it
    # the shell holds PID 1, swallows the signal, and the embedded matcher never gets
    # its clean drain.
    #
    # One uvicorn worker, which EMBED_WORKER requires: with --workers N each worker
    # would start its own matcher and relay. Correctness survives that, but it
    # multiplies the polling for no gain.
    dockerCommand: 'sh -c "alembic upgrade head && exec uvicorn ledgerloop.api.app:app --host 0.0.0.0 --port $PORT --workers 1"'

    # /health, not /ready. Render's health check restarts an unhealthy service, which
    # makes it a liveness probe -- and wiring a dependency check into liveness is how a
    # brief database blip turns into a restart loop. /ready still exists and still
    # reports Postgres and Redis; it is for a load balancer, which Render's is not.
    healthCheckPath: /health

    envVars:
      - key: LEDGERLOOP_DATABASE_URL
        fromDatabase:
          name: ledgerloop-db
          property: connectionString
      - key: LEDGERLOOP_REDIS_URL
        fromService:
          type: keyvalue
          name: ledgerloop-redis
          property: connectionString
      - key: LEDGERLOOP_LOG_JSON
        value: "true"

      # The free-tier switch. Hosts the matcher, relay and sweeper on this process's
      # event loop. Set to "false" the moment a background worker is affordable and add
      # the worker service back per DEPLOY.md -- nothing else has to change.
      - key: LEDGERLOOP_EMBED_WORKER
        value: "true"
      - key: LEDGERLOOP_ENABLE_RELAY
        value: "true"
      # On, and in-process. The GitHub Actions cron is the backstop for when this free
      # instance is asleep; it cannot be the primary, because a 15-minute tick means a
      # break takes 15 minutes to appear and nobody demos that.
      - key: LEDGERLOOP_ENABLE_SWEEPER
        value: "true"
      - key: LEDGERLOOP_SWEEP_INTERVAL_S
        value: "30"

      # 60s, not the 300s production default. Demo tuning, and it is only safe because
      # the matcher is in this same process: the window must exceed worst-case
      # end-to-end match latency, or the sweeper reaches a row before the matcher does
      # and reports a counterparty that *did* arrive as an unmatched break. Embedded,
      # that latency is milliseconds. Raise this to 300 for anything real.
      - key: LEDGERLOOP_UNMATCHED_AFTER_S
        value: "60"

      # The free Key Value plan is 25MB. The 1,000,000 default would let Redis hit its
      # memory ceiling long before MAXLEN ever trimmed, turning a bounded-by-design
      # buffer into an out-of-memory. Raise this with the plan, not on its own.
      - key: LEDGERLOOP_STREAM_MAXLEN
        value: "50000"

      # The browser calls this API cross-origin, so the static site's URL must be listed
      # or every request fails preflight. sync:false because the URL is not known until
      # ledgerloop-web has deployed once -- set it then, to exactly
      # https://ledgerloop-web.onrender.com (no trailing slash), and redeploy.
      - key: LEDGERLOOP_CORS_ORIGINS
        sync: false

  # --- Static frontend ------------------------------------------------------
  # Pure client: it ingests through the API and renders what the API returns. There is
  # no matching engine in the browser any more, which is why this is a static bundle
  # with no runtime configuration beyond the API's address.
  - type: web
    name: ledgerloop-web
    runtime: static
    # No region: a static site is served from Render's global CDN rather than from one
    # datacentre, and the blueprint is rejected if you name one. The region note at the
    # top of this file applies to the three resources that hold state or run a process.
    rootDir: frontend
    # `npm ci` not `npm install`: the lockfile is the build input, and a deploy that
    # silently resolved a different dependency tree than CI tested is not the same app.
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    # SPA rewrite. Without it a hard refresh on /results asks the host for a file that
    # does not exist and gets a 404 -- the routes are client-side. Render matches real
    # files first, so /samples/*.csv still serve as themselves.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    envVars:
      # Baked in at BUILD time by Vite, not read at runtime -- changing it requires a
      # redeploy, not a restart. sync:false for the same ordering reason as CORS above:
      # set it to https://ledgerloop-api.onrender.com once the API has a URL.
      - key: VITE_API_BASE_URL
        sync: false
