[alembic]
script_location = alembic
prepend_sys_path = .
# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s
# The URL is intentionally absent: env.py reads it from LEDGERLOOP_DATABASE_URL via
# Settings, so migrations can never be pointed at a different database than the app.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
